<!doctype html>
<!-- terminal hub. install.sh fills in the @PLACEHOLDERS@ and ttyd serves the result at /. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0e1115">
<meta name="color-scheme" content="dark">
<meta name="description" content="@DESCRIPTION@">
<title>@NAME@</title>
<link rel="manifest" href="/assets/app.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/app-32.png">
<link rel="apple-touch-icon" href="/assets/app-192.png">
<script type="importmap">
{
  "imports": {
    "@xterm/xterm": "@LIB@/vendor/xterm.mjs",
    "@xterm/addon-fit": "@LIB@/vendor/addon-fit.mjs",
    "@xterm/addon-webgl": "@LIB@/vendor/addon-webgl.mjs",
    "@xterm/addon-unicode11": "@LIB@/vendor/addon-unicode11.mjs",
    "@xterm/addon-web-links": "@LIB@/vendor/addon-web-links.mjs"
  }
}
</script>
<!-- install.sh fills in two /assets/v/HASH prefixes, one for the libraries and font, one for the
     page's own files: what's under them never changes, so browsers keep it, and updating the page
     doesn't fetch the libraries again. Preloading fetches every module at once. -->
<style>@font-face { font-family: "FiraCode NF"; src: url(@LIB@/FiraCodeNF.woff2) format("woff2"); font-display: block; }</style>
<link rel="preload" href="@LIB@/FiraCodeNF.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="@LIB@/vendor/xterm.css">
<link rel="stylesheet" href="@APP@/app.css">
<link rel="modulepreload" href="@APP@/term.js">
<link rel="modulepreload" href="@APP@/keys.js">
<link rel="modulepreload" href="@APP@/icons.js">
<link rel="modulepreload" href="@LIB@/vendor/xterm.mjs">
<link rel="modulepreload" href="@LIB@/vendor/addon-fit.mjs">
<link rel="modulepreload" href="@LIB@/vendor/addon-webgl.mjs">
<link rel="modulepreload" href="@LIB@/vendor/addon-unicode11.mjs">
<link rel="modulepreload" href="@LIB@/vendor/addon-web-links.mjs">
<script type="module" src="@APP@/app.js"></script>
@SERVICE_WORKER@
</head>
<body>
<noscript>The terminal hub needs JavaScript.</noscript>
</body>
</html>
