<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="/assets/app.webmanifest">
<link rel="apple-touch-icon" href="/assets/app-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/app-32.png">
<link rel="preload" href="/assets/FiraCodeNF.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: "FiraCode NF"; src: url(/assets/FiraCodeNF.woff2) format("woff2"); font-display: block; }
html, body { height: 100%; margin: 0; overflow: hidden; background: #000; }
#terminal-container { height: calc(100% - var(--keys-h, 0px)) !important; }
#keys {
  position: fixed; left: 0; right: 0; bottom: 0; height: 44px; z-index: 10;
  display: flex; gap: 4px; padding: 4px; box-sizing: border-box;
  overflow-x: auto; scrollbar-width: none; background: #0b0d10; border-top: 1px solid #22262c;
  touch-action: pan-x; -webkit-user-select: none; user-select: none;
}
#keys::-webkit-scrollbar { display: none; }
#keys button {
  flex: 0 0 auto; min-width: 42px; padding: 0 10px; border: 0; border-radius: 6px;
  background: #1c2027; color: #d6dae0; font: 14px "FiraCode NF", monospace;
}
#keys button:active { background: #2d333c; }
#keys button.on { background: #1f6feb; color: #fff; }
#keys button.nav { color: #7ee787; }
#keys .sep { flex: 0 0 1px; background: #2a2f36; margin: 4px 2px; }
#keys button.off { opacity: .4; }

/* Session panel (sessions.js): a sidebar on wide screens, a sheet over the terminal on phones. */
:root { --side-w: 232px; }
#hub-panel, #hub-scrim { display: none; }
#hub-panel {
  box-sizing: border-box; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #2a2f36 transparent;
  background: #0b0d10; color: #d6dae0; font: 14px "FiraCode NF", monospace; z-index: 20;
  -webkit-user-select: none; user-select: none;
}
body.hub-side #hub-panel {
  display: block; position: fixed; left: 0; top: 0; bottom: 0; width: var(--side-w);
  border-right: 1px solid #22262c;
}
body.hub-side #terminal-container { margin-left: var(--side-w) !important; }
body.hub-side #keys { left: var(--side-w); }
body.hub-sheet #hub-panel {
  display: block; position: fixed; left: 0; right: 0; bottom: var(--keys-h, 44px); max-height: 60%;
  padding-bottom: 8px; border-top: 1px solid #22262c; border-radius: 12px 12px 0 0;
  box-shadow: 0 -12px 32px #000a;
}
body.hub-sheet #hub-scrim { display: block; position: fixed; inset: 0 0 var(--keys-h, 44px) 0; z-index: 19; background: #0008; }
.hp-top {
  display: flex; align-items: center; justify-content: space-between; padding: 10px 10px 2px 12px;
  color: #8b949e; font-size: 12px;
}
.hp-top button {
  padding: 3px 9px; border: 0; border-radius: 6px; background: #1c2027; color: #d6dae0;
  font: 12px "FiraCode NF", monospace; cursor: pointer;
}
.hp-top button:hover { background: #2d333c; }
.hp-label { padding: 12px 12px 4px; color: var(--c, #8b949e); font-size: 12px; }
.hp-label.hp-click { cursor: pointer; }
.hp-note { margin-left: 8px; color: #8b949e; }
.hp-row {
  display: flex; align-items: center; gap: 8px; width: 100%; box-sizing: border-box;
  padding: 7px 12px 7px 10px; border: 0; border-left: 2px solid transparent; background: none;
  color: #d6dae0; font: inherit; text-align: left; cursor: pointer;
}
.hp-row:hover { background: #14171c; }
.hp-row.now { background: #1c2027; border-left-color: var(--c); color: #fff; }
.hp-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hp-meta { color: #8b949e; font-size: 12px; }
.hp-new { color: #8b949e; }
body.hub-sheet .hp-row { padding-top: 11px; padding-bottom: 11px; }  /* thumb-sized */
</style>
