# terminal-hub's tmux settings: swipe scrolling from a phone, window sizes that follow the screen
# you used last, and a quiet dark status line tagged with where you are. In ~/.tmux.conf:
#   set -g @hub-tag laptop               (default: the hostname)
#   set -g @hub-colour '#7ee787'
#   source-file -q ~/.local/share/terminal-hub/tmux.conf

set -goqF @hub-tag '#h'
set -goq @hub-colour '#7ee787'

# The hub turns swipes into mouse-wheel events, so tmux needs mouse mode to scroll its history.
set -g mouse on
set -g history-limit 50000
# Size windows to the most recently active client (phone vs desktop).
set -g window-size latest
setw -g aggressive-resize on
set -g default-terminal "tmux-256color"
set -sg escape-time 10

set -g status-style "bg=#0b0d10,fg=#8b949e"
set -g status-left-length 40
set -g status-right-length 20
set -g status-left "#[bg=#{@hub-colour},fg=#0b0d10,bold] #{@hub-tag} #[default] #[fg=#d6dae0]#S  "
set -g status-right "#[fg=#8b949e]%H:%M "
set -g window-status-separator ""
set -g window-status-format "#[fg=#8b949e] #I #W "
set -g window-status-current-format "#[bg=#1c2027,fg=#d6dae0] #I #W "
set -g message-style "bg=#1c2027,fg=#d6dae0"
set -g message-command-style "bg=#1c2027,fg=#d6dae0"
set -g mode-style "bg=#1f6feb,fg=#ffffff"
set -g pane-border-style "fg=#22262c"
set -g pane-active-border-style "fg=#30363d"
